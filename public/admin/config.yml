local_backend: true

backend:
  name: github
  repo: SrikarChittemsetty/srikarchittemsetty
  branch: main
  base_url: https://srikarchittemsetty.vercel.app
  auth_endpoint: api/auth

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: activity
    label: Activity
    label_singular: Activity Entry
    folder: content/activity
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{commit_date}} — {{fields.title}}"
    sortable_fields: [commit_date, date]
    fields:
      - label: Link
        name: link
        widget: string
        required: false
        hint: URL of the essay, video, podcast, or paper. Leave blank for a bare thought.
      - label: Title
        name: title
        widget: string
        required: false
        hint: What it's called. This is the text people click.
      - label: Source
        name: source
        widget: string
        required: false
        hint: Channel, publication, or author.
      - label: Kind
        name: kind
        widget: select
        required: false
        options: [essay, video, podcast, book, paper, note]
      - label: Thought
        name: note
        widget: text
        required: false
        hint: Optional. Say something only if you actually have something to say.
      - label: Date (only if logging an older day)
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
        default: ""
        hint: >-
          Leave empty. Set it only when writing up a day that already passed —
          it overrides the automatic commit stamp.
